<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reunión con Mercado Libre Negocios</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* Tema azul marino (elegido por Jordan, 6-oct-2026) */
  body{--bg:#0E1A2E;--card:#14233D;--border:#243756;--text:#F4F7FB;--muted:#B8C4D8;--optbg:#1B2E4D;--optborder:#2F4770;--hoverbg:#22406E}
  body{font-family:'Proxima Nova','Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .header{background:#FFE600;padding:18px 24px;border-bottom:2px solid #e6c900}
  .header img{height:44px;display:block}
  .wrap{max-width:640px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 26px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  h1{font-size:22px;margin-bottom:6px;color:var(--text)}
  .lead{font-size:15px;color:var(--muted);margin:10px 0 22px}
  h2{font-size:16px;margin-bottom:12px;color:var(--text)}
  .opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:14px 16px;margin-bottom:10px;border-radius:10px;
       border:1.5px solid var(--optborder);background:var(--optbg);color:var(--text);cursor:pointer}
  .opt:hover{border-color:#3483FA;background:var(--hoverbg)}
  .opt.primary{border-color:#3483FA;background:#3483FA;color:#fff;font-weight:600}
  .opt.primary:hover{background:#2968c8;border-color:#2968c8}
  .opt:disabled{opacity:.55;cursor:default}
  .gracias{display:none;text-align:center;padding:10px 0}
  .gracias h2{font-size:20px;margin-bottom:8px;color:var(--text)}
  .gracias p{font-size:15px;color:var(--muted)}
  footer{text-align:center;font-size:11px;color:var(--muted);opacity:.7;padding:18px}
</style>
</head>
<body>
<div class="header">
  <img src="https://http2.mlstatic.com/frontend-assets/ml-web-navigation/ui-navigation/7.18.0/mercadolibre/logo__large_plus@2x.png" alt="Mercado Libre">
</div>
<div class="wrap">
  <div class="card">
    <div id="pregunta">
      <h1>Reunión con Mercado Libre Negocios</h1>
      <p class="lead">Mercado Libre Negocios es el área exclusiva para compradores corporativos y empresas con negocio propio interesadas en comprar. Las reuniones son solo para ese perfil.</p>
      <h2>¿Cuál es tu interés?</h2>
      <button class="opt primary" data-valor="Comprar con beneficios para mi empresa" data-comprar="1">Comprar con beneficios para mi empresa</button>
      <button class="opt" data-valor="Vender en la plataforma" data-msg="Para vender en Mercado Libre puedes registrarte desde mercadolibre.com.mx.">Vender en la plataforma</button>
      <button class="opt" data-valor="Operar o cobrar con Mercado Pago" data-msg="Para operar o cobrar con Mercado Pago puedes entrar a mercadopago.com.mx.">Operar o cobrar con Mercado Pago</button>
      <button class="opt" data-valor="Otro" data-msg="">Otro</button>
    </div>
    <div id="gracias" class="gracias">
      <h2 id="g-titulo">Gracias por tu interés</h2>
      <p id="g-texto"></p>
    </div>
  </div>
</div>
<footer>Mercado Libre Negocios</footer>

<script>
  var ACCION = 'https://docs.google.com/forms/d/e/1FAIpQLSfikgVUXzjRbBd9d_dg6Wcy9Qg97kcjBBsGziloEvbgOq6uQg/formResponse';
  var ENTRY_REF = 'entry.301989891';
  var ENTRY_INTERES = 'entry.301989893';
  var AGENDA = 'https://calendar.app.google/vqHCkgvEREZkXmh69';
  var ref = (new URLSearchParams(location.search).get('c') || sessionStorage.getItem('nbe_ref') || 'directo').replace(/[^A-Za-z0-9_\-]/g, '').slice(0, 40) || 'directo';
  // se guarda el CID y se limpia la barra de direcciones (queda solo el dominio); si recarga, se conserva por la sesion
  try { sessionStorage.setItem('nbe_ref', ref); history.replaceState(null, '', location.pathname); } catch (e) {}

  function registrar(valor) {
    var datos = new URLSearchParams();
    datos.set(ENTRY_REF, ref);
    datos.set(ENTRY_INTERES, valor);
    return fetch(ACCION, { method: 'POST', mode: 'no-cors', body: datos, keepalive: true }).catch(function () {});
  }

  // Registro de apertura (una vez por visita): permite medir cuantos abren contra cuantos eligen una opcion
  try {
    var kApertura = 'nbe_apertura_' + ref;
    if (!sessionStorage.getItem(kApertura)) {
      sessionStorage.setItem(kApertura, '1');
      registrar('Abrió la página (sin elegir)');
    }
  } catch (e) { registrar('Abrió la página (sin elegir)'); }

  document.querySelectorAll('.opt').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; });
      var valor = b.getAttribute('data-valor');
      var comprar = b.getAttribute('data-comprar') === '1';
      registrar(valor).then(function () {
        if (comprar) {
          document.getElementById('pregunta').style.display = 'none';
          document.getElementById('g-titulo').textContent = 'Te llevamos a la agenda';
          document.getElementById('g-texto').textContent = 'Elige el horario que mejor te acomode.';
          document.getElementById('gracias').style.display = 'block';
          setTimeout(function () { location.href = AGENDA; }, 700);
        } else {
          document.getElementById('pregunta').style.display = 'none';
          document.getElementById('g-texto').textContent =
            'Estas reuniones son exclusivas para compradores corporativos. ' + (b.getAttribute('data-msg') || 'Recibimos tu respuesta.');
          document.getElementById('gracias').style.display = 'block';
        }
      });
    });
  });
</script>
</body>
</html>
